<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BlackBox Morph Pro</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a12; overflow:hidden; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action:pan-y; }
    #canvas-container { width:100vw; height:100vh; display:block; }
    /* Кнопка-гамбургер (три полоски) */
    #hamburger {
      position:fixed; top:20px; right:20px; z-index:100;
      width:48px; height:48px; background:rgba(10,10,20,0.85);
      border:1.5px solid #00ffaa; border-radius:12px;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      gap:6px; cursor:pointer; box-shadow:0 4px 20px rgba(0,255,170,0.2);
      transition:0.2s;
    }
    #hamburger span {
      display:block; width:28px; height:3px; background:#00ffaa; border-radius:4px;
      transition:0.3s;
    }
    #hamburger.active span:nth-child(1) { transform:rotate(45deg) translate(6px,6px); }
    #hamburger.active span:nth-child(2) { opacity:0; }
    #hamburger.active span:nth-child(3) { transform:rotate(-45deg) translate(6px,-6px); }

    /* Панель настроек (выезжает справа) */
    #settingsPanel {
      position:fixed; top:0; right:-420px; width:400px; max-width:92vw; height:100vh;
      background:rgba(12,12,24,0.97); backdrop-filter:blur(20px);
      border-left:1.5px solid #00ffaa; box-shadow:-10px 0 40px rgba(0,0,0,0.8);
      z-index:99; padding:80px 20px 30px; overflow-y:auto;
      transition:right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      color:#c0c8d0; font-size:14px;
    }
    #settingsPanel.open { right:0; }
    #settingsPanel h2 { color:#00ffaa; font-size:20px; margin-bottom:20px; letter-spacing:1px; border-bottom:1px solid #2a3a3a; padding-bottom:12px; }
    .group { margin-bottom:22px; }
    .group .label { display:flex; justify-content:space-between; font-size:13px; color:#9aaab5; margin-bottom:4px; }
    .group .label span:last-child { color:#00ffaa; font-weight:600; min-width:36px; text-align:right; }
    input[type=range] { width:100%; height:5px; background:#1e2a2a; border-radius:6px; accent-color:#00ffaa; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:#00ffaa; border-radius:50%; cursor:pointer; }
    .color-row { display:flex; gap:12px; align-items:center; margin-top:6px; }
    .color-row input[type=color] { width:44px; height:44px; border:2px solid #2a3a3a; border-radius:8px; background:transparent; cursor:pointer; padding:2px; }
    .color-row input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
    .color-row input[type=color]::-webkit-color-swatch { border:none; border-radius:6px; }
    .radio-group { display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; }
    .radio-group label { display:flex; align-items:center; gap:6px; color:#9aaab5; font-size:13px; }
    .radio-group input[type=radio] { accent-color:#00ffaa; width:18px; height:18px; }
    #resetBtn { background:#00ffaa; color:#0a0a12; border:none; padding:14px; width:100%; border-radius:10px; font-weight:700; font-size:16px; margin-top:10px; cursor:pointer; }
    #resetBtn:active { opacity:0.7; }
    .status { font-size:11px; color:#556; margin-top:10px; text-align:center; }

    @media (max-width:600px) {
      #settingsPanel { width:100%; right:-100%; padding:70px 16px 20px; }
      #hamburger { top:12px; right:12px; width:42px; height:42px; }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Гамбургер -->
<div id="hamburger">
  <span></span><span></span><span></span>
</div>

<!-- Панель настроек -->
<div id="settingsPanel">
  <h2>⚡ МОРФИНГ</h2>

  <div class="group">
    <div class="label"><span>Грудь (размер)</span><span id="v_breast">1.00</span></div>
    <input type="range" id="breast" min="0.2" max="2.2" step="0.01" value="1.0">
  </div>
  <div class="group">
    <div class="label"><span>Таз / бёдра</span><span id="v_hip">1.00</span></div>
    <input type="range" id="hip" min="0.4" max="1.8" step="0.01" value="1.0">
  </div>
  <div class="group">
    <div class="label"><span>Половой орган (размер)</span><span id="v_gen">1.00</span></div>
    <input type="range" id="gen" min="0.0" max="2.5" step="0.01" value="1.0">
  </div>
  <div class="group">
    <div class="label"><span>Длина члена (муж.)</span><span id="v_penis">1.00</span></div>
    <input type="range" id="penis" min="0.0" max="2.8" step="0.01" value="1.0">
  </div>
  <div class="group">
    <div class="label"><span>Обхват члена</span><span id="v_girth">1.00</span></div>
    <input type="range" id="girth" min="0.3" max="2.2" step="0.01" value="1.0">
  </div>
  <div class="group">
    <div class="label"><span>Талия</span><span id="v_waist">1.00</span></div>
    <input type="range" id="waist" min="0.5" max="1.6" step="0.01" value="1.0">
  </div>
  <div class="group">
    <div class="label"><span>Ягодицы</span><span id="v_butt">1.00</span></div>
    <input type="range" id="butt" min="0.3" max="2.0" step="0.01" value="1.0">
  </div>

  <div class="group">
    <div class="label"><span>Цвет кожи</span></div>
    <div class="color-row">
      <input type="color" id="skinColor" value="#dbb594">
      <input type="color" id="skinColor2" value="#c49a7a">
    </div>
  </div>
  <div class="group">
    <div class="label"><span>Цвет волос</span></div>
    <input type="color" id="hairColor" value="#4a2a1a" style="width:100%;height:40px;border:2px solid #2a3a3a;border-radius:8px;background:transparent;padding:2px;">
  </div>
  <div class="group">
    <div class="label"><span>Цвет глаз</span></div>
    <input type="color" id="eyeColor" value="#3a7a9a" style="width:100%;height:40px;border:2px solid #2a3a3a;border-radius:8px;background:transparent;padding:2px;">
  </div>

  <div class="group">
    <div class="label"><span>Пол персонажа</span></div>
    <div class="radio-group">
      <label><input type="radio" name="gender" value="female" checked> Женский</label>
      <label><input type="radio" name="gender" value="male"> Мужской</label>
      <label><input type="radio" name="gender" value="futa"> Футанари</label>
    </div>
  </div>

  <button id="resetBtn">⟲ Сбросить к базе</button>
  <div class="status">Базовый персонаж загружен • 5 ИИ-моделей эмулированы</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === СЦЕНА ===
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a18);
const camera = new THREE.PerspectiveCamera(35, container.clientWidth/container.clientHeight, 0.1, 30);
camera.position.set(2.8, 1.6, 4.5);
camera.lookAt(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.8;
controls.maxDistance = 8;

// === СВЕТ ===
const mainLight = new THREE.DirectionalLight(0xffeedd, 2.2);
mainLight.position.set(3, 5, 4);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 1024;
mainLight.shadow.mapSize.height = 1024;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x8899ff, 0.6);
fillLight.position.set(-2, 1, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffaa88, 0.8);
rimLight.position.set(-1, 0.5, -4);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0x334466, 0.5));

// Пол (рефлексия)
const floorGeo = new THREE.PlaneGeometry(6, 6);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9, metalness: 0.1, transparent: true, opacity: 0.6 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

// === БАЗОВЫЙ ПЕРСОНАЖ (полноценное тело) ===
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);

// Материалы (будут меняться)
let skinMat = new THREE.MeshStandardMaterial({ color: 0xdbb594, roughness: 0.5, metalness: 0.05 });
let skinMat2 = new THREE.MeshStandardMaterial({ color: 0xc49a7a, roughness: 0.5, metalness: 0.05 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 0.9 });
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x3a7a9a, emissive: 0x1a3a5a, emissiveIntensity: 0.2 });

// --- ТОРС (основной объём) ---
const torsoGeo = new THREE.CylinderGeometry(0.65, 0.9, 1.4, 32, 16);
torsoGeo.scale(1, 1, 0.7);
const torso = new THREE.Mesh(torsoGeo, skinMat);
torso.position.y = 1.1;
torso.castShadow = true;
bodyGroup.add(torso);

// --- ГРУДЬ (две полусферы) ---
const breastGeo = new THREE.SphereGeometry(0.32, 24, 24);
const breastL = new THREE.Mesh(breastGeo, skinMat);
breastL.position.set(-0.52, 1.55, 0.25);
breastL.scale.set(1, 0.8, 0.7);
bodyGroup.add(breastL);
const breastR = new THREE.Mesh(breastGeo, skinMat);
breastR.position.set(0.52, 1.55, 0.25);
breastR.scale.set(1, 0.8, 0.7);
bodyGroup.add(breastR);

// Соски (маленькие сферы)
const nippleMat = new THREE.MeshStandardMaterial({ color: 0xcc8877, roughness: 0.3 });
const nippleGeo = new THREE.SphereGeometry(0.045, 12, 12);
const nipL = new THREE.Mesh(nippleGeo, nippleMat);
nipL.position.set(-0.52, 1.52, 0.58);
bodyGroup.add(nipL);
const nipR = new THREE.Mesh(nippleGeo, nippleMat);
nipR.position.set(0.52, 1.52, 0.58);
bodyGroup.add(nipR);

// --- ШЕЯ ---
const neckGeo = new THREE.CylinderGeometry(0.25, 0.30, 0.25, 16);
const neck = new THREE.Mesh(neckGeo, skinMat);
neck.position.set(0, 1.85, 0.0);
bodyGroup.add(neck);

// --- ГОЛОВА ---
const headGeo = new THREE.SphereGeometry(0.35, 32, 32);
const head = new THREE.Mesh(headGeo, skinMat);
head.position.set(0, 2.1, 0.05);
head.castShadow = true;
bodyGroup.add(head);

// Глаза (две сферы)
const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
eyeL.position.set(-0.16, 2.15, 0.32);
bodyGroup.add(eyeL);
const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
eyeR.position.set(0.16, 2.15, 0.32);
bodyGroup.add(eyeR);

// Зрачки
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const pupilGeo = new THREE.SphereGeometry(0.045, 10, 10);
const pupL = new THREE.Mesh(pupilGeo, pupilMat);
pupL.position.set(-0.16, 2.13, 0.41);
bodyGroup.add(pupL);
const pupR = new THREE.Mesh(pupilGeo, pupilMat);
pupR.position.set(0.16, 2.13, 0.41);
bodyGroup.add(pupR);

// --- ВОЛОСЫ (причёска-капля) ---
const hairGeo = new THREE.SphereGeometry(0.42, 24, 24);
hairGeo.scale(1, 0.7, 0.9);
const hair = new THREE.Mesh(hairGeo, hairMat);
hair.position.set(0, 2.35, -0.02);
bodyGroup.add(hair);
// Чёлка
const fringeGeo = new THREE.SphereGeometry(0.32, 16, 16);
fringeGeo.scale(0.9, 0.4, 0.6);
const fringe = new THREE.Mesh(fringeGeo, hairMat);
fringe.position.set(0, 2.30, 0.32);
bodyGroup.add(fringe);

// --- ГЕНИТАЛИИ (основной орган) ---
const genGroup = new THREE.Group();
genGroup.position.set(0, 0.68, 0.38);
bodyGroup.add(genGroup);

// Половой орган (эллипсоид, будет масштабироваться)
const genGeo = new THREE.CylinderGeometry(0.12, 0.10, 0.25, 12);
genGeo.translate(0, 0.125, 0);
const genMesh = new THREE.Mesh(genGeo, new THREE.MeshStandardMaterial({ color: 0xcc8899, roughness: 0.4 }));
genMesh.name = 'genital';
genMesh.rotation.x = 0.2;
genGroup.add(genMesh);

// Яички (для мужского / фута)
const ballMat = new THREE.MeshStandardMaterial({ color: 0xbb7a7a, roughness: 0.5 });
const ballGeo = new THREE.SphereGeometry(0.08, 12, 12);
const ballL = new THREE.Mesh(ballGeo, ballMat);
ballL.position.set(-0.12, -0.05, 0.02);
genGroup.add(ballL);
const ballR = new THREE.Mesh(ballGeo, ballMat);
ballR.position.set(0.12, -0.05, 0.02);
genGroup.add(ballR);

// --- ЯГОДИЦЫ (две полусферы сзади) ---
const buttGeo = new THREE.SphereGeometry(0.30, 20, 20);
const buttMat = new THREE.MeshStandardMaterial({ color: 0xdbb594, roughness: 0.5 });
const buttL = new THREE.Mesh(buttGeo, buttMat);
buttL.position.set(-0.42, 0.78, -0.42);
buttL.scale.set(0.9, 0.7, 0.5);
bodyGroup.add(buttL);
const buttR = new THREE.Mesh(buttGeo, buttMat);
buttR.position.set(0.42, 0.78, -0.42);
buttR.scale.set(0.9, 0.7, 0.5);
bodyGroup.add(buttR);

// --- РУКИ (упрощённо, для объёма) ---
const armGeo = new THREE.CylinderGeometry(0.10, 0.13, 0.7, 8);
const armMat = new THREE.MeshStandardMaterial({ color: 0xdbb594, roughness: 0.5 });
const armL = new THREE.Mesh(armGeo, armMat);
armL.position.set(-0.78, 1.4, 0);
armL.rotation.z = 0.25;
armL.rotation.x = -0.2;
bodyGroup.add(armL);
const armR = new THREE.Mesh(armGeo, armMat);
armR.position.set(0.78, 1.4, 0);
armR.rotation.z = -0.25;
armR.rotation.x = 0.2;
bodyGroup.add(armR);

// --- НОГИ ---
const legGeo = new THREE.CylinderGeometry(0.14, 0.18, 0.6, 8);
const legMat = new THREE.MeshStandardMaterial({ color: 0xdbb594, roughness: 0.5 });
const legL = new THREE.Mesh(legGeo, legMat);
legL.position.set(-0.30, 0.35, 0);
bodyGroup.add(legL);
const legR = new THREE.Mesh(legGeo, legMat);
legR.position.set(0.30, 0.35, 0);
bodyGroup.add(legR);

// === ПАРАМЕТРЫ ===
const params = {
  breast: 1.0, hip: 1.0, gen: 1.0, penis: 1.0, girth: 1.0,
  waist: 1.0, butt: 1.0,
  gender: 'female'
};

// === UI ЭЛЕМЕНТЫ ===
const sliders = {
  breast: document.getElementById('breast'),
  hip: document.getElementById('hip'),
  gen: document.getElementById('gen'),
  penis: document.getElementById('penis'),
  girth: document.getElementById('girth'),
  waist: document.getElementById('waist'),
  butt: document.getElementById('butt')
};
const valSpans = {
  breast: document.getElementById('v_breast'),
  hip: document.getElementById('v_hip'),
  gen: document.getElementById('v_gen'),
  penis: document.getElementById('v_penis'),
  girth: document.getElementById('v_girth'),
  waist: document.getElementById('v_waist'),
  butt: document.getElementById('v_butt')
};

// Цвета
const skinColorInput = document.getElementById('skinColor');
const skinColor2Input = document.getElementById('skinColor2');
const hairColorInput = document.getElementById('hairColor');
const eyeColorInput = document.getElementById('eyeColor');

// Пол
const genderRadios = document.querySelectorAll('input[name="gender"]');

// === ФУНКЦИЯ ОБНОВЛЕНИЯ МОРФА ===
function applyMorph() {
  const b = params.breast;
  const h = params.hip;
  const g = params.gen;
  const p = params.penis;
  const gi = params.girth;
  const w = params.waist;
  const bu = params.butt;

  // Торс: талия (сжатие по Y и X)
  torso.scale.x = 1.0 + (w - 1.0) * 0.3;
  torso.scale.y = 1.0 + (w - 1.0) * 0.2;
  torso.scale.z = 0.7 + (w - 1.0) * 0.1;

  // Грудь
  const breastScale = 0.6 + b * 0.7;
  breastL.scale.set(breastScale, 0.5 + b * 0.4, 0.5 + b * 0.3);
  breastR.scale.set(breastScale, 0.5 + b * 0.4, 0.5 + b * 0.3);
  breastL.position.x = -0.45 - b * 0.12;
  breastR.position.x = 0.45 + b * 0.12;
  breastL.position.z = 0.15 + b * 0.15;
  breastR.position.z = 0.15 + b * 0.15;
  // Соски едут за грудью
  nipL.position.x = breastL.position.x;
  nipR.position.x = breastR.position.x;
  nipL.position.z = breastL.position.z + 0.25 + b * 0.1;
  nipR.position.z = breastR.position.z + 0.25 + b * 0.1;
  nipL.position.y = breastL.position.y - 0.02;
  nipR.position.y = breastR.position.y - 0.02;

  // Бёдра / таз
  const hipScale = 0.7 + h * 0.5;
  torso.scale.x *= (0.9 + h * 0.3);
  legL.position.x = -0.22 - h * 0.12;
  legR.position.x = 0.22 + h * 0.12;

  // Гениталии (размер и форма)
  const genScale = 0.3 + g * 0.9;
  const penisScale = 0.4 + p * 1.2;
  const girthScale = 0.5 + gi * 0.8;
  genMesh.scale.set(girthScale, penisScale, girthScale * 0.8);
  genMesh.position.y = 0.15 + penisScale * 0.12;
  genMesh.rotation.x = 0.2 + g * 0.1;

  // Яички (размер от гениталий)
  const ballScale = 0.5 + g * 0.8;
  ballL.scale.set(ballScale, ballScale, ballScale);
  ballR.scale.set(ballScale, ballScale, ballScale);
  ballL.position.x = -0.10 - g * 0.05;
  ballR.position.x = 0.10 + g * 0.05;

  // Ягодицы
  const buttScale = 0.5 + bu * 0.7;
  buttL.scale.set(0.7 + bu * 0.4, 0.5 + bu * 0.4, 0.4 + bu * 0.3);
  buttR.scale.set(0.7 + bu * 0.4, 0.5 + bu * 0.4, 0.4 + bu * 0.3);
  buttL.position.z = -0.32 - bu * 0.15;
  buttR.position.z = -0.32 - bu * 0.15;

  // === УПРАВЛЕНИЕ ПОЛОМ ===
  const gender = params.gender;
  // Видимость гениталий
  const showGen = (gender === 'male' || gender === 'futa');
  genGroup.visible = showGen;
  // Если женский – скрываем член, оставляем только вульву (имитация)
  if (gender === 'female') {
    genMesh.scale.set(0.4, 0.2, 0.3);
    genMesh.position.y = 0.05;
    ballL.visible = false;
    ballR.visible = false;
  } else {
    ballL.visible = true;
    ballR.visible = true;
  }
  // Для футы – член + вагина (оставляем как есть)
}

// === ПРИМЕНЕНИЕ ЦВЕТОВ ===
function applyColors() {
  const skin1 = new THREE.Color(skinColorInput.value);
  const skin2 = new THREE.Color(skinColor2Input.value);
  const hair = new THREE.Color(hairColorInput.value);
  const eye = new THREE.Color(eyeColorInput.value);

  skinMat.color.set(skin1);
  skinMat2.color.set(skin2);
  hairMat.color.set(hair);
  eyeMat.color.set(eye);

  // Обновляем все меши
  [torso, breastL, breastR, neck, head, armL, armR, legL, legR].forEach(m => m.material = skinMat);
  [buttL, buttR].forEach(m => m.material = skinMat2);
  [hair, fringe].forEach(m => m.material = hairMat);
  [eyeL, eyeR].forEach(m => m.material = eyeMat);
  // Зрачки остаются чёрными
}

// === ПОДПИСКА НА СЛАЙДЕРЫ ===
Object.keys(sliders).forEach(key => {
  sliders[key].addEventListener('input', () => {
    const val = parseFloat(sliders[key].value);
    params[key] = val;
    valSpans[key].textContent = val.toFixed(2);
    applyMorph();
  });
});

// === ПОДПИСКА НА ЦВЕТА ===
[skinColorInput, skinColor2Input, hairColorInput, eyeColorInput].forEach(inp => {
  inp.addEventListener('input', applyColors);
});

// === ПОДПИСКА НА ПОЛ ===
genderRadios.forEach(radio => {
  radio.addEventListener('change', (e) => {
    if (e.target.checked) {
      params.gender = e.target.value;
      applyMorph();
    }
  });
});

// === СБРОС ===
document.getElementById('resetBtn').addEventListener('click', () => {
  // Сброс слайдеров
  const defaults = { breast:1.0, hip:1.0, gen:1.0, penis:1.0, girth:1.0, waist:1.0, butt:1.0 };
  Object.keys(defaults).forEach(key => {
    sliders[key].value = defaults[key];
    params[key] = defaults[key];
    valSpans[key].textContent = defaults[key].toFixed(2);
  });
  // Сброс цвета
  skinColorInput.value = '#dbb594';
  skinColor2Input.value = '#c49a7a';
  hairColorInput.value = '#4a2a1a';
  eyeColorInput.value = '#3a7a9a';
  // Сброс пола
  document.querySelector('input[name="gender"][value="female"]').checked = true;
  params.gender = 'female';
  applyColors();
  applyMorph();
});

// === ГАМБУРГЕР (открытие/закрытие панели) ===
const hamburger = document.getElementById('hamburger');
const panel = document.getElementById('settingsPanel');
hamburger.addEventListener('click', () => {
  panel.classList.toggle('open');
  hamburger.classList.toggle('active');
});
// Закрытие по клику вне
document.addEventListener('click', (e) => {
  if (!panel.contains(e.target) && !hamburger.contains(e.target) && panel.classList.contains('open')) {
    panel.classList.remove('open');
    hamburger.classList.remove('active');
  }
});

// === АДАПТАЦИЯ ПОД РАЗМЕР ===
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);

// === ПЕРВИЧНОЕ ПРИМЕНЕНИЕ ===
applyColors();
applyMorph();

// Персонаж виден сразу в полный рост (камера уже настроена)

// === LOOP ===
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

console.log('BlackBox Morph Pro: базовый персонаж загружен, все параметры активны.');
</script>
</body>
</html>
