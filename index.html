<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BlackBox Morph (Mobile)</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; color:#0f0; font-family:system-ui,monospace; touch-action:pan-y; }
    #ui { position:fixed; bottom:0; left:0; width:100%; max-height:60vh; background:#111; border-top:2px solid #0f0; padding:12px 16px; overflow-y:auto; z-index:10; }
    .slider-group { margin:8px 0; }
    .slider-group label { display:flex; justify-content:space-between; font-size:14px; color:#aaa; }
    input[type=range] { width:100%; accent-color:#0f0; background:#222; height:4px; }
    select, button { width:100%; padding:10px; margin:6px 0; background:#0f0; color:#000; border:none; font-weight:bold; border-radius:4px; font-size:16px; }
    select { background:#222; color:#0f0; border:1px solid #0f0; }
    button:disabled { background:#444; color:#666; }
    #canvas-container { width:100vw; height:100vh; overflow:hidden; background:#000; }
    #check { display:flex; align-items:center; gap:10px; color:#888; font-size:13px; margin:6px 0; }
    #check input { width:20px; height:20px; accent-color:#0f0; }
    .badge { font-size:10px; color:#555; text-align:center; margin-top:8px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <h3 style="color:#0f0;font-size:18px;margin:4px 0;">⬡ BLACKBOX MORPH</h3>
    <div id="check"><input type="checkbox" id="ageConfirm"> <span>Все персонажи вымышлены и старше 18 лет</span></div>
    <div class="slider-group"><label>Грудь <span id="v_breast">0.50</span></label><input type="range" id="breast" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="slider-group"><label>Таз <span id="v_hip">0.50</span></label><input type="range" id="hip" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="slider-group"><label>Гениталии <span id="v_gen">0.50</span></label><input type="range" id="gen" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="slider-group"><label>Мышцы <span id="v_muscle">0.50</span></label><input type="range" id="muscle" min="0" max="1" step="0.01" value="0.5"></div>
    <div class="slider-group"><label>Влажность <span id="v_wet">0.50</span></label><input type="range" id="wet" min="0" max="1" step="0.01" value="0.5"></div>
    <select id="poseSelect"><option value="missionary">Миссионерская</option><option value="doggy">Догги</option><option value="sitting">Сидячая</option></select>
    <button id="renderBtn" disabled>Рендер 1 кадра</button>
    <button id="genBtn" disabled>Анимация (60 кадров)</button>
    <div class="badge">Модели загружаются из CDN при первом рендере</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // === СЦЕНА ===
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth/container.clientHeight, 0.1, 20);
    camera.position.set(2.5, 1.8, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;

    // Свет
    scene.add(new THREE.DirectionalLight(0xffccaa, 1.8));
    scene.add(new THREE.AmbientLight(0x4466aa, 0.6));
    const rim = new THREE.DirectionalLight(0x8888ff, 0.5);
    rim.position.set(-1, 0.5, -2);
    scene.add(rim);

    // === БАЗОВАЯ ФИГУРА (человеческий торс с возможностью морфинга) ===
    // Группа для всех частей
    const bodyGroup = new THREE.Group();
    scene.add(bodyGroup);

    // Торс (эллипсоид)
    const torsoGeo = new THREE.SphereGeometry(0.9, 48, 48);
    torsoGeo.scale(0.9, 1.1, 0.6);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xddbbaa,
      roughness: 0.5,
      metalness: 0.05,
      emissive: 0x221122,
      emissiveIntensity: 0.1
    });
    const torso = new THREE.Mesh(torsoGeo, mat);
    torso.position.y = 1.2;
    bodyGroup.add(torso);

    // Голова (для антропоморфности)
    const headGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.set(0, 1.9, 0.1);
    bodyGroup.add(head);

    // === ПАРАМЕТРЫ МОРФИНГА (без внешних моделей - чистая геометрия) ===
    const params = { breast:0.5, hip:0.5, gen:0.5, muscle:0.5, wet:0.5 };
    const sliders = { breast, hip, gen, muscle, wet } = {
      breast: document.getElementById('breast'),
      hip: document.getElementById('hip'),
      gen: document.getElementById('gen'),
      muscle: document.getElementById('muscle'),
      wet: document.getElementById('wet')
    };
    const v_breast = document.getElementById('v_breast');
    const v_hip = document.getElementById('v_hip');
    const v_gen = document.getElementById('v_gen');
    const v_muscle = document.getElementById('v_muscle');
    const v_wet = document.getElementById('v_wet');

    function applyMorph() {
      // Грудь: масштабирование X и Z для торса
      const b = (params.breast - 0.5) * 2; // -1..1
      torso.scale.x = 0.9 + b * 0.4;
      torso.scale.z = 0.6 + b * 0.3;
      // Таз: масштабирование Y и X
      const h = (params.hip - 0.5) * 2;
      torso.scale.y = 1.1 + h * 0.3;
      // Гениталии: добавляем маленькую сферу, масштабируем
      let genMesh = bodyGroup.getObjectByName('genMesh');
      if (!genMesh) {
        const g = new THREE.SphereGeometry(0.1, 16, 16);
        genMesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xcc8899, roughness: 0.3 }));
        genMesh.name = 'genMesh';
        genMesh.position.set(0, 0.7, 0.35);
        bodyGroup.add(genMesh);
      }
      const gScale = 0.5 + params.gen * 2.5;
      genMesh.scale.set(gScale, gScale*0.6, gScale*0.4);
      // Мышцы: bumpMap имитация через нормаль
      torso.material.roughness = 0.5 - params.muscle * 0.3;
      // Влажность: металличность
      torso.material.metalness = params.wet * 0.4;
      torso.material.needsUpdate = true;
    }

    // Привязка слайдеров
    Object.keys(sliders).forEach(key => {
      sliders[key].addEventListener('input', () => {
        const val = parseFloat(sliders[key].value);
        params[key] = val;
        const span = document.getElementById(`v_${key}`);
        if (span) span.textContent = val.toFixed(2);
        if (document.getElementById('ageConfirm').checked) {
          applyMorph();
          document.getElementById('renderBtn').disabled = false;
          document.getElementById('genBtn').disabled = false;
        }
      });
    });

    // Чекбокс 18+
    document.getElementById('ageConfirm').addEventListener('change', (e) => {
      const checked = e.target.checked;
      document.getElementById('renderBtn').disabled = !checked;
      document.getElementById('genBtn').disabled = !checked;
      if (checked) applyMorph();
    });

    // === ГЕНЕРАЦИЯ (эмуляция ИИ) ===
    async function generateFrame(pose, params) {
      // Имитация работы 5 моделей - возвращает canvas с наложенной информацией
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      // Градиентный фон
      const grd = ctx.createRadialGradient(256,256,50,256,256,300);
      grd.addColorStop(0, '#3a1a3a');
      grd.addColorStop(1, '#0a0a1a');
      ctx.fillStyle = grd;
      ctx.fillRect(0,0,512,512);
      // Рисуем человеческую фигуру (стилизованно)
      ctx.fillStyle = '#ddbbaa';
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 20;
      // Торс
      const bw = 80 + params.breast * 60;
      const bh = 140 + params.hip * 40;
      ctx.beginPath();
      ctx.ellipse(256, 280, bw/2, bh/2, 0, 0, Math.PI*2);
      ctx.fill();
      // Голова
      ctx.beginPath();
      ctx.arc(256, 170, 40, 0, Math.PI*2);
      ctx.fill();
      // Гениталии
      ctx.fillStyle = '#cc8899';
      ctx.shadowBlur = 30;
      const gs = 10 + params.gen * 40;
      ctx.beginPath();
      ctx.ellipse(256, 350, gs, gs*0.5, 0, 0, Math.PI*2);
      ctx.fill();
      // Текст поверх
      ctx.shadowBlur = 0;
      ctx.font = '18px monospace';
      ctx.fillStyle = '#0f0';
      ctx.fillText(`Поза: ${pose}`, 20, 40);
      ctx.fillText(`Грудь: ${params.breast.toFixed(2)}`, 20, 70);
      ctx.fillText(`Генит: ${params.gen.toFixed(2)}`, 20, 100);
      return canvas;
    }

    document.getElementById('renderBtn').addEventListener('click', async () => {
      const pose = document.getElementById('poseSelect').value;
      const canvas = await generateFrame(pose, params);
      // Показать как текстуру на плоскости в сцене
      const tex = new THREE.CanvasTexture(canvas);
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(1.6, 1.6),
        new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
      );
      plane.position.set(0, 2.8, 0);
      plane.name = 'preview';
      const old = bodyGroup.getObjectByName('preview');
      if (old) bodyGroup.remove(old);
      bodyGroup.add(plane);
    });

    document.getElementById('genBtn').addEventListener('click', async () => {
      const pose = document.getElementById('poseSelect').value;
      const frames = [];
      for (let i=0; i<60; i++) {
        const t = i/60;
        const p = { ...params, breast: Math.max(0, Math.min(1, params.breast + Math.sin(t*Math.PI*2)*0.15)) };
        frames.push(await generateFrame(pose, p));
      }
      // Воспроизведение анимации через смену текстуры каждые 100мс
      let idx = 0;
      const interval = setInterval(() => {
        const tex = new THREE.CanvasTexture(frames[idx % frames.length]);
        let plane = bodyGroup.getObjectByName('preview');
        if (!plane) {
          plane = new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
          plane.name = 'preview';
          plane.position.set(0, 2.8, 0);
          bodyGroup.add(plane);
        } else {
          plane.material.map = tex;
          plane.material.needsUpdate = true;
        }
        idx++;
        if (idx >= frames.length) clearInterval(interval);
      }, 100);
    });

    // === LOOP ===
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Первичный рендер
    applyMorph();
    console.log('BlackBox Morph готов. Все 5 моделей эмулированы через геометрию.');
  </script>
</body>
</html>
